[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-diversity-engine"
version = "0.1.0"
description = "Provider-neutral prompt builder and validator for diverse LLM idea portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "bluehige"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
idea-diversity = "idea_diversity_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
