name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - run: dge list-verticals
      - run: dge build-prompt --brief examples/briefs/safety_training.json --vertical safety-training --mode stratified --output /tmp/dge-prompt.txt
      - run: dge validate --input examples/outputs/sample_portfolio.json
