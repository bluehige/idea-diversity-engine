<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narrative Lens Panel · DGE</title><style>:root{color-scheme:dark;--bg:#0e1017;--p:#191d29;--line:#30364b;--tx:#eef0f7;--muted:#9ca3b8;--ac:#6f78ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin:2px 0 20px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:17px}textarea,select{width:100%;background:#0d111a;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}textarea{min-height:150px;resize:vertical}.lenses{display:grid;gap:7px;max-height:440px;overflow:auto;margin:12px 0}.lens{padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#202536}.lens.active{border-color:var(--ac);background:#2b3260}.lens b{display:block}.lens small{color:var(--muted)}button{border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:800;padding:11px 15px;cursor:pointer}button.alt{background:#2b3042;margin-left:6px}pre{margin:0;white-space:pre-wrap;word-break:break-word;min-height:660px}.row{display:flex;gap:7px;align-items:center}.row select{flex:1}@media(max-width:820px){.grid{grid-template-columns:1fr}pre{min-height:400px}}</style></head>
<body><div class="wrap"><h1>서사 관점 패널</h1><div class="sub">다양성 생성 엔진 · 20개의 추상화된 서사 설계 렌즈</div><div class="grid"><section class="card"><label>소설 발제</label><textarea id="brief" placeholder="설정, 캐릭터, 플롯 또는 고민 지점을 작성"></textarea><label>참신함 범위</label><div class="row"><select id="mode"><option value="balanced">균형</option><option value="tail">참신함</option><option value="extreme">극한 탐색</option></select></div><div class="lenses" id="lenses"></div><button onclick="build()">렌즈 프롬프트 생성</button><button class="alt" onclick="copyOut()">복사</button></section><section class="card"><pre id="out">왼쪽에서 발제와 서사 렌즈를 선택하십시오.</pre></section></div></div>
<script>
const L=[
['증거물 편집자','규칙·금기·기록물로 오컬트 공포를 검수'],['전장 감독','액션을 선택의 결과와 생존 윤리로 설계'],['흥행 설계자','진입 훅과 작품의 중심 주제를 함께 보호'],['칼춤 감독','전투 속도·사이다·팬덤 약속을 검수'],['밈 조련사','굴림·유머·역전의 텐션 루프를 설계'],['등가교환 공정장','힘·성공·관계에 명확한 대가를 부여'],['제약의 마술사','능력의 제약과 승리조건으로 두뇌전 설계'],['약속의 연금사','초반 약속을 마지막 카타르시스로 회수'],['불쾌의 설계자','억압·금기·심리 압박의 누적을 검수'],['회색의 관찰자','군상극·현실 대사·인물의 거짓말을 검수'],['오해의 여왕벌','관계 마찰과 소동의 변주를 설계'],['침묵의 감독','과설명을 줄이고 시선·거리·타이밍으로 연출'],['항해의 총감독','꿈·동료·장기 복선과 에피소드 밀도를 설계'],['공감의 칼날','연민과 단죄가 공존하는 감정 타격을 설계'],['근육의 설교자','격투를 욕망과 철학의 과장된 이미지로 전환'],['식탁의 세계설계자','생활·생태·먹고사는 방식으로 세계를 증명'],['탈락의 편집자','생존 경쟁 속 구원과 탈락 기준을 검수'],['도장의 교관','무도·실전 논리·훈련의 결과를 검수'],['조직의 풍자자','직장·관료제·현장 운영을 사건 엔진으로 활용'],['망한 파티장','루저 코미디와 이세계 장르 규칙을 비틀기']
];let current=0;const box=document.getElementById('lenses');box.innerHTML=L.map((x,i)=>`<div class="lens ${i===0?'active':''}" onclick="pick(${i})"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');function pick(i){current=i;document.querySelectorAll('.lens').forEach((e,n)=>e.classList.toggle('active',n===i))}
function build(){const b=document.getElementById('brief').value.trim()||'발제 미입력';const m=document.getElementById('mode').value;const tau={balanced:'0.20',tail:'0.10',extreme:'0.03'}[m];const [name,focus]=L[current];document.getElementById('out').textContent=`당신은 다양성 생성 엔진의 “${name}” 서사 렌즈다. 실존 작가의 문체를 모방하지 말고 다음 추상화된 설계 관점만 사용하라.\n\n[렌즈 초점]\n${focus}\n\n[사용자 발제]\n${b}\n\n[피드백 구조]\n1. 진입장벽·논리·감정·반복 중 가장 약한 지점을 구체적으로 진단한다.\n2. 이 렌즈로 개선 가능한 장치 2~3개를 제안한다.\n3. 수정 과정에서도 지켜야 할 코어를 한 문장으로 정리한다.\n4. 사용자가 다음 장면 또는 규칙을 결정하게 만드는 질문 1개를 던진다.\n\n[대안 포트폴리오]\n- 서로 다른 방향의 후보 5개를 생성한다.\n- 각 후보에 text, typicality_estimate, stratum, key_mechanisms, concise_rationale, risks를 붙인다.\n- 가능한 한 typicality_estimate ${tau} 이하를 탐색하되, 무의미해지면 recommended_tau를 제안한다.\n- 전형성 값의 합계를 1로 맞추지 않는다. 전형성은 품질·흥행 확률이 아니다.\n- 비공개 사고과정을 출력하지 말고 짧고 검수 가능한 근거만 작성한다.\n\nMarkdown으로 명확하게 응답하라.`}async function copyOut(){await navigator.clipboard.writeText(document.getElementById('out').textContent)}
</script></body></html>
