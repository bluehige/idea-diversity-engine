<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Starter · DGE</title><style>:root{color-scheme:dark;--b:#0d1017;--p:#181c28;--l:#31374b;--t:#edf0f7;--m:#9aa2b8;--a:#a56cff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px/1.55 system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px}h1{margin:0}.sub{color:var(--m);margin:2px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:700;margin-bottom:4px}input,textarea,select{width:100%;background:#0d111a;border:1px solid var(--l);color:var(--t);border-radius:9px;padding:9px;font:inherit}textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}button{border:0;border-radius:10px;background:var(--a);color:white;padding:11px 15px;font-weight:800;cursor:pointer;margin-top:13px}button.alt{background:#30364a;margin-left:6px}pre{margin:0;white-space:pre-wrap;word-break:break-word;min-height:650px}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.wide{grid-column:auto}pre{min-height:400px}}</style></head><body><div class="wrap"><h1>캐릭터 시동기</h1><div class="sub">다양성 생성 엔진 · 행동과 관계로 캐릭터를 시작합니다</div><div class="grid"><section class="card"><div class="fields"><div><label>임시 호칭</label><input id="nick" placeholder="검은 우산 상담사"></div><div><label>역할 원형</label><input id="role" placeholder="사람을 살리는 장의사"></div><div><label>눈에 띄는 것</label><input id="signal" placeholder="외형·소품·행동 하나"></div><div><label>겉과 속의 모순</label><input id="paradox" placeholder="겉은 다정하지만..."></div><div><label>가장 원하는 것</label><input id="desire" placeholder="동사형 목표"></div><div><label>치명적 약점</label><input id="weak" placeholder="현재 사건을 꼬이게 하는 약점"></div><div><label>방해자·나쁜 사건</label><input id="obstacle"></div><div><label>소문</label><input id="rumor"></div><div class="wide"><label>행동 시그널</label><input id="habit" placeholder="대사 없이도 알아보게 하는 버릇"></div><div><label>유형</label><select id="type"><option>주요 인물</option><option>적·라이벌</option><option>조력자</option><option>트리커·사건 촉발자</option></select></div><div><label>다양성 모드</label><select id="mode"><option value="balanced">균형</option><option value="tail">반클리셰</option><option value="stratified">관계·행동 층화</option></select></div></div><button onclick="build()">캐릭터 프롬프트 생성</button><button class="alt" onclick="copyOut()">복사</button></section><section class="card"><pre id="out">입력칸은 일부만 채워도 됩니다. 빈 항목은 후보 분포로 생성하도록 지시합니다.</pre></section></div></div><script>const ids=['nick','role','signal','paradox','desire','weak','obstacle','rumor','habit'];const labels=['임시 호칭','역할 원형','눈에 띄는 것','겉과 속의 모순','가장 원하는 것','치명적 약점','방해자·나쁜 사건','소문','행동 시그널'];function build(){let data=ids.map((id,i)=>`- ${labels[i]}: ${document.getElementById(id).value.trim()||'미입력 — 후보 생성'}`).join('\n');const mode=document.getElementById('mode').value;document.getElementById('out').textContent=`당신은 다양성 생성 엔진의 캐릭터 시동기다. 프로필 백과사전이 아니라 첫 장면에서 작동하는 욕망·약점·관계·행동 엔진을 설계하라.\n\n[유형]\n${document.getElementById('type').value}\n\n[입력]\n${data}\n\n[다양성 모드]\n${mode}\n\n[절차]\n1. 입력된 항목은 보존하고 빈 항목은 서로 다른 메커니즘의 후보 3개씩 검토한다.\n2. 가장 전형적인 조합 하나에 수렴하지 말고 역할, 욕망, 약점, 관계가 다른 캐릭터 후보 5개를 만든다.\n3. 각 후보에 typicality_estimate, stratum, concise_rationale, key_mechanisms, risks를 붙인다. 전형성 합계를 1로 맞추지 않는다.\n4. 욕망은 동사형이며 약점은 현재 사건을 실제로 꼬이게 해야 한다.\n5. 실존 인물·작가·기존 캐릭터를 직접 모방하지 않는다. 비공개 사고과정 대신 짧은 근거만 출력한다.\n\n[후보별 출력]\n- 한 줄 소개\n- 120~200자 첫 등장 장면\n- 주인공·라이벌·트리커 관계 삼각형\n- 제3자 소문 3개\n- 행동 규칙 5개\n- 위기, 호감 대상, 약점 노출 장면 테스트\n- 식별성/모순성/추진력/취약성/사회성/연출성 점수와 개선점\n\n하나의 JSON 객체로 응답하라.`}async function copyOut(){await navigator.clipboard.writeText(document.getElementById('out').textContent)}</script></body></html>
